<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ASTC to PNG Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        .btn {
            min-width: 120px;
            min-height: 44px;
            font-size: 0.875rem;
        }
        body {
            padding: 1rem;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-100 flex flex-col items-center justify-center">
    <div class="w-full max-w-md mx-auto">
        <h1 class="text-2xl sm:text-3xl font-bold mb-6 text-center">ASTC to PNG Converter</h1>
        <form method="post" class="flex flex-col gap-4 items-center">
            <input 
                type="password" 
                name="key" 
                placeholder="Enter access key" 
                class="w-full p-2 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                required
            >
            <input 
                type="submit" 
                value="Login" 
                class="btn py-2 px-4 bg-blue-500 text-white rounded hover:bg-blue-600 font-semibold text-center"
            >
        </form>
        {% if error %}
            <p class="text-red-500 text-center mt-4">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
